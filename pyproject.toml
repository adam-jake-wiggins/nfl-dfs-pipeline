[project]
name = "nfl-dfs-pipeline"
version = "0.1.0"
description = "Constrained portfolio optimization under a salary cap: a weekly NFL DFS data pipeline with MILP lineup construction and point-in-time data capture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adam Wiggins" }]

# Runtime dependencies. Loose ranges here; exact versions are pinned in
# uv.lock, which is committed. That split is deliberate: the ranges express
# what the code is compatible with, the lockfile expresses what was actually
# tested.
dependencies = [
    # Mixed-integer solver used by the lineup optimizer. Ships with CBC.
    "pulp>=3.0,<4.0",
    # HTTP client for the odds and slate adapters.
    "requests>=2.32,<3.0",
    # nflverse access: schedules, play-by-play, and the player ID crosswalk
    # that replaces name-based joins. Requires Python >=3.10.
    "nflreadpy>=0.1.5,<1.0",
    # Timezone database. macOS and Linux ship one; Windows does not, and
    # slate times are published in US Eastern across the DST boundary.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    # Property-based testing: generates many inputs to find edge cases that
    # hand-written examples miss.
    "hypothesis>=6.100,<7.0",
    "pytest-cov>=5.0,<7.0",
]

[project.scripts]
# Console entry points. After installation these are real commands on PATH,
# so `dfs-snapshot` works from any directory.
dfs-snapshot = "dfs_pipeline.cli.snapshot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfs_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q keeps output readable; --strict-markers makes a typo'd marker an error
# rather than a silently ignored test.
addopts = "-q --strict-markers"
filterwarnings = [
    # PuLP 4.0 removes PULP_CBC_CMD and the direct LpVariable constructor.
    # pyproject pins pulp<4.0, so this is a scheduled migration, not a live
    # failure. Silenced here so it does not drown real warnings; tracked in
    # DEVLOG open items.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    "ignore:Constructing LpVariable:DeprecationWarning",
]
markers = [
    "slow: tests that take more than a second (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/dfs_pipeline"]
branch = true
